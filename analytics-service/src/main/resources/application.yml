spring:
  application:
    name: analytics-service

  datasource:
    # DATABASE_URL / DATABASE_USERNAME / DATABASE_PASSWORD are the production
    # names; the SPRING_DATASOURCE_* forms (used by docker-compose) still work
    # and take precedence when both are set (relaxed binding).
    url: ${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gitinsight_analytics}}
    username: ${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
    password: ${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}

  jpa:
    hibernate:
      ddl-auto: update
    # SQL logging off by default; enable with SHOW_SQL=true when debugging locally.
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8082

eureka:
  client:
    service-url:
      # EUREKA_URL is the production name; EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
      # (docker-compose) still overrides it via relaxed binding when set.
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
