spring:
  application:
    name: api-gateway

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveSecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveUserDetailsServiceAutoConfiguration

  cloud:
    gateway:

      # Spring Cloud Gateway CORS — env-driven so Render/Vercel can set the
      # allowed origin without redeploying code.
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "${CORS_ALLOWED_ORIGINS:https://git-insight-ai-one.vercel.app}"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
                maxAge: 3600

          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

          routes:
            # ── Auth Service ──────────────────────────────────────────────
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:https://git-insight-auth.onrender.com}
              predicates:
                - Path=/api/auth/**
              metadata:
                response-timeout: 60000
                connect-timeout: 5000

            # ── Recruiter Service (auth-service) ──────────────────────────
            - id: recruiter-service
              uri: ${AUTH_SERVICE_URL:https://git-insight-auth.onrender.com}
              predicates:
                - Path=/api/recruiter/**
              metadata:
                response-timeout: 60000
                connect-timeout: 5000

            # ── Admin Service (auth-service) ──────────────────────────────
            - id: admin-service
              uri: ${AUTH_SERVICE_URL:https://git-insight-auth.onrender.com}
              predicates:
                - Path=/api/admin/**
              metadata:
                response-timeout: 60000
                connect-timeout: 5000

            # ── GitHub Service ────────────────────────────────────────────
            - id: github-service
              uri: ${GITHUB_SERVICE_URL:https://gitinsight-github-service.onrender.com}
              predicates:
                - Path=/api/github/**
              metadata:
                response-timeout: 120000
                connect-timeout: 5000

            # ── AI Service (github-service) ──────────────────────────────
            - id: ai-service
              uri: ${GITHUB_SERVICE_URL:https://gitinsight-github-service.onrender.com}
              predicates:
                - Path=/api/ai/**
              metadata:
                response-timeout: 120000
                connect-timeout: 5000

            # ── Reports Service (github-service) ─────────────────────────
            - id: reports-service
              uri: ${GITHUB_SERVICE_URL:https://gitinsight-github-service.onrender.com}
              predicates:
                - Path=/api/reports/**
              metadata:
                response-timeout: 120000
                connect-timeout: 5000

            # ── Analytics Service (placeholder — currently only health) ───
            - id: analytics-service
              uri: ${ANALYTICS_SERVICE_URL:https://git-insight-ai.onrender.com}
              predicates:
                - Path=/api/analytics/**
              metadata:
                response-timeout: 60000
                connect-timeout: 5000

          httpclient:
            connect-timeout: 5000
            response-timeout: 60s

# =====================================
# EUREKA — environment-driven; enable in deployments that use Eureka
# =====================================
eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP:false}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://git-insight-ai-one.vercel.app}
  jwt:
    secret: ${JWT_SECRET}
    min-secret-bytes: ${JWT_MIN_SECRET_BYTES:32}

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.gitinsight.gateway: INFO
