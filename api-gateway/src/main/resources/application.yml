spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
        - name: ForwardPath
      routes:
        # ── Auth Service ──────────────────────────────────────────────
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**
            - Path=/api/recruiter/**
            - Path=/api/admin/**
          filters:
            - name: CircuitBreaker
              args:
                name: auth-service-cb
                fallbackUri: forward:/fallback/auth
            - StripPrefix=0
          metadata:
            response-timeout: 60000
            connect-timeout: 5000

        # ── GitHub Service ────────────────────────────────────────────
        - id: github-service
          uri: lb://GITHUB-SERVICE
          predicates:
            - Path=/api/github/**
          filters:
            - name: CircuitBreaker
              args:
                name: github-service-cb
                fallbackUri: forward:/fallback/github
            - StripPrefix=0
          metadata:
            response-timeout: 120000
            connect-timeout: 5000

        # ── AI Service ────────────────────────────────────────────────
        - id: ai-service
          uri: lb://GITHUB-SERVICE
          predicates:
            - Path=/api/ai/**
          filters:
            - name: CircuitBreaker
              args:
                name: ai-service-cb
                fallbackUri: forward:/fallback/ai
            - StripPrefix=0
          metadata:
            response-timeout: 120000
            connect-timeout: 5000

        # ── Reports Service ───────────────────────────────────────────
        - id: reports-service
          uri: lb://GITHUB-SERVICE
          predicates:
            - Path=/api/reports/**
          filters:
            - name: CircuitBreaker
              args:
                name: reports-service-cb
                fallbackUri: forward:/fallback/reports
            - StripPrefix=0
          metadata:
            response-timeout: 120000
            connect-timeout: 5000

        # ── Analytics Service ─────────────────────────────────────────
        - id: analytics-service
          uri: lb://ANALYTICS-SERVICE
          predicates:
            - Path=/api/analytics/**
          filters:
            - name: CircuitBreaker
              args:
                name: analytics-service-cb
                fallbackUri: forward:/fallback/analytics
            - StripPrefix=0
          metadata:
            response-timeout: 60000
            connect-timeout: 5000

      # Global timeout defaults
      httpclient:
        connect-timeout: 5000
        response-timeout: 60s

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
  jwt:
    secret: ${JWT_SECRET}
    min-secret-bytes: ${JWT_MIN_SECRET_BYTES:32}

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.gitinsight.gateway: DEBUG
