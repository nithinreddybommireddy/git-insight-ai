spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "https://git-insight-ai-one.vercel.app"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600

      routes:
        # ── Auth Service ──────────────────────────────────────────────
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**
          metadata:
            response-timeout: 60000
            connect-timeout: 5000

        # ── Recruiter Service (auth-service) ──────────────────────────
        - id: recruiter-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/recruiter/**
          metadata:
            response-timeout: 60000
            connect-timeout: 5000

        # ── Admin Service (auth-service) ──────────────────────────────
        - id: admin-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/admin/**
          metadata:
            response-timeout: 60000
            connect-timeout: 5000

        # ── GitHub Service ────────────────────────────────────────────
        - id: github-service
          uri: lb://GITHUB-SERVICE
          predicates:
            - Path=/api/github/**
          metadata:
            response-timeout: 120000
            connect-timeout: 5000

        # ── AI Service (github-service) ──────────────────────────────
        - id: ai-service
          uri: lb://GITHUB-SERVICE
          predicates:
            - Path=/api/ai/**
          metadata:
            response-timeout: 120000
            connect-timeout: 5000

        # ── Reports Service (github-service) ─────────────────────────
        - id: reports-service
          uri: lb://GITHUB-SERVICE
          predicates:
            - Path=/api/reports/**
          metadata:
            response-timeout: 120000
            connect-timeout: 5000

        # ── Analytics Service ─────────────────────────────────────────
        - id: analytics-service
          uri: lb://ANALYTICS-SERVICE
          predicates:
            - Path=/api/analytics/**
          metadata:
            response-timeout: 60000
            connect-timeout: 5000

      httpclient:
        connect-timeout: 5000
        response-timeout: 60s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
  jwt:
    secret: ${JWT_SECRET}
    min-secret-bytes: ${JWT_MIN_SECRET_BYTES:32}

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.gitinsight.gateway: INFO