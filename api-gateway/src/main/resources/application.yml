spring:
  application:
    name: api-gateway

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveSecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveUserDetailsServiceAutoConfiguration

  cloud:
    gateway:

      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "https://git-insight-ai-one.vercel.app"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:https://git-insight-auth.onrender.com}
          predicates:
            - Path=/api/auth/**
          metadata:
            response-timeout: 60000
            connect-timeout: 5000

        - id: recruiter-service
          uri: ${AUTH_SERVICE_URL:https://git-insight-auth.onrender.com}
          predicates:
            - Path=/api/recruiter/**
          metadata:
            response-timeout: 60000
            connect-timeout: 5000

        - id: admin-service
          uri: ${AUTH_SERVICE_URL:https://git-insight-auth.onrender.com}
          predicates:
            - Path=/api/admin/**
          metadata:
            response-timeout: 60000
            connect-timeout: 5000

        - id: github-service
          uri: ${GITHUB_SERVICE_URL:https://gitinsight-github-service.onrender.com}
          predicates:
            - Path=/api/github/**
          metadata:
            response-timeout: 120000
            connect-timeout: 5000

        - id: ai-service
          uri: ${GITHUB_SERVICE_URL:https://gitinsight-github-service.onrender.com}
          predicates:
            - Path=/api/ai/**
          metadata:
            response-timeout: 120000
            connect-timeout: 5000

        - id: reports-service
          uri: ${GITHUB_SERVICE_URL:https://gitinsight-github-service.onrender.com}
          predicates:
            - Path=/api/reports/**
          metadata:
            response-timeout: 120000
            connect-timeout: 5000

        - id: analytics-service
          uri: ${ANALYTICS_SERVICE_URL:https://git-insight-ai.onrender.com}
          predicates:
            - Path=/api/analytics/**
          metadata:
            response-timeout: 60000
            connect-timeout: 5000

      httpclient:
        connect-timeout: 5000
        response-timeout: 60s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  jwt:
    secret: ${JWT_SECRET}
    min-secret-bytes: ${JWT_MIN_SECRET_BYTES:32}

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.gitinsight.gateway: INFO