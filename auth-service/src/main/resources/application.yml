spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/gitinsight_auth
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

app:
  cors:
    # Comma-separated allowlist of frontend origins (only needed when the frontend
    # is hosted on a different origin; same-origin proxies never trigger CORS).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    # Per-IP brute-force guard for /api/auth/login and /api/auth/register (in-memory, per instance).
    auth-rate-limit-per-minute: 20
  jwt:
    # No fallback: the app must NOT boot with a known/committed signing key.
    # Provide JWT_SECRET in the environment (32+ random bytes).
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
    refresh-expiration-ms: 2592000000
  oauth:
    github:
      # Optional feature: empty until GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET are set.
      # The OAuth endpoints return a clear error instead of using fake credentials.
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
      # Public callback URL registered in the GitHub OAuth app.
      redirect-uri: ${GITHUB_OAUTH_REDIRECT_URI:http://localhost:8083/api/auth/oauth/github/callback}
      # Where the browser lands after a successful login (frontend token-consumer route).
      frontend-redirect-uri: ${OAUTH_FRONTEND_REDIRECT_URI:http://localhost:5173/auth/callback}
  github-service-url: ${GITHUB_SERVICE_URL:http://localhost:8081}
