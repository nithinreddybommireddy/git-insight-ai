spring:
  application:
    name: auth-service

  datasource:
    # DATABASE_URL / DATABASE_USERNAME / DATABASE_PASSWORD are the production
    # names; the SPRING_DATASOURCE_* forms (used by docker-compose) still work
    # and take precedence when both are set (relaxed binding).
        url: ${SPRING_DATASOURCE_URL}
        username: ${SPRING_DATASOURCE_USERNAME}
        password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    # Production: don't keep a lazy-load session open during view/serialization.
    open-in-view: false

  autoconfigure:
    # JWT-filter auth only — no default in-memory user / generated password.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  data:
    redis:
      # Shared Redis used for the login rate limiter and single-use OAuth state.
      # Production deployments should point this at a managed Redis (e.g. ElastiCache).
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8083

eureka:
  client:
    service-url:
      # EUREKA_URL is the production name; EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
      # (docker-compose) still overrides it via relaxed binding when set.
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

app:
  cors:
    # Comma-separated allowlist of frontend origins (only needed when the frontend
    # is hosted on a different origin; same-origin proxies never trigger CORS).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    # Per-IP brute-force guard for /api/auth/login and /api/auth/register (in-memory, per instance).
    auth-rate-limit-per-minute: 20
  internal-api-key: ${INTERNAL_API_KEY:}
  # Server-to-server credential used when calling github-service's internal AI
  # endpoints (/api/ai/job-match). Must match INTERNAL_API_KEY on github-service.
  # When unset, recruiter AI explanations are skipped (deterministic only).
  auth:
    # HttpOnly session cookies: Secure flag is required behind HTTPS (production).
    # Local dev runs over http://localhost, so it defaults to false.
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    # SameSite policy: Lax for same-origin (Vercel /api proxy makes frontend and API same-origin).
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
  jwt:
    # No fallback: the app must NOT boot with a known/committed signing key.
    # Provide JWT_SECRET in the environment (32+ random bytes).
    secret: ${JWT_SECRET}
    # Access tokens are intentionally short-lived (15 min): the role is embedded
    # in the token, so a role change (or disable) must take effect quickly. The
    # frontend silently refreshes on 401, so users don't notice the shorter TTL.
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000}
    # Minimum signing-key length in bytes. Raise to 64 in production
    # (JWT_MIN_SECRET_BYTES=64) so deployments cannot ship a 32-byte key.
    min-secret-bytes: ${JWT_MIN_SECRET_BYTES:32}
  oauth:
    github:
      # Optional feature: empty until GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET are set.
      # The OAuth endpoints return a clear error instead of using fake credentials.
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
      # Public callback URL registered in the GitHub OAuth app.
      # Production: https://git-insight-ai-one.vercel.app/api/auth/oauth/github/callback
      # (Vercel /api proxy routes this to the Gateway → Auth Service)
      redirect-uri: ${GITHUB_OAUTH_REDIRECT_URI:http://localhost:8080/api/auth/oauth/github/callback}
      # Where the browser lands after a successful login (frontend token-consumer route).
      frontend-redirect-uri: ${OAUTH_FRONTEND_REDIRECT_URI:http://localhost:5173/auth/callback}
  github-service-url: ${GITHUB_SERVICE_URL:http://localhost:8081}
  # Frontend URL used in password reset emails.
  # Production: https://git-insight-ai-one.vercel.app
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  # Mail configuration for password reset emails.
  # Set MAIL_ENABLED=true and configure SMTP in production.
  # In local development (MAIL_ENABLED=false), reset links are logged to console.
  mail:
    enabled: ${MAIL_ENABLED:false}
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:noreply@gitinsightai.com}

# Required for @Async email sending (only active when MAIL_ENABLED=true).
spring.task.execution:
  pool:
    core-size: 2
    max-size: 5

logging:
  level:
    org.springframework.security: INFO
    com.gitinsight.authservice: INFO
