spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/gitinsight_auth
    username: postgres
    password: 12345678

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

app:
  jwt:
    secret: "A1B2C3D4E5F6G7H8I9J0K1L2M3N4O5P6Q7R8S9T0U1V2W3X4Y5Z6A1B2C3D4E5F6G7H8"
    expiration-ms: 86400000
    refresh-expiration-ms: 2592000000
  oauth:
    github:
      client-id: ${GITHUB_CLIENT_ID:mock-client-id}
      client-secret: ${GITHUB_CLIENT_SECRET:mock-client-secret}
      redirect-uri: http://localhost:8083/api/auth/oauth/github/callback
  github-service-url: ${GITHUB_SERVICE_URL:http://localhost:8081}
