# ============================================================================
# GitInsight-AI — production override.
#
# Usage:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#
# Differences from the dev stack (docker-compose.yml):
#   • No service publishes a host port. PostgreSQL, Redis, Eureka and the three
#     Spring services are reachable ONLY inside the private Docker network.
#   • Only the frontend (nginx, which serves the SPA and proxies /api to the
#     services internally) is exposed — on port 80.
#
# Resulting topology:
#
#                  Internet
#                     │
#                  HTTPS :443
#                     │
#                 ┌────▼────┐
#                 │  nginx  │   (TLS terminates at your load balancer / ingress,
#                 └────┬────┘    or configure certificates in frontend/nginx.conf)
#                      │
#           Private Docker Network
#                      │
#        ┌─────────────┼─────────────┐
#        │             │             │
#      Auth         GitHub       Analytics
#        │             │
#        └──────┬──────┘
#               │
#        ┌──────┴──────┐
#        │             │
#      Redis       PostgreSQL
#
# Requirements (see docs/DEPLOYMENT.md for the full list):
#   AUTH_COOKIE_SECURE=true  JWT_SECRET=<64+ random bytes>
#   POSTGRES_PASSWORD / REDIS_PASSWORD / INTERNAL_API_KEY = strong secrets
#   CORS_ALLOWED_ORIGINS, GITHUB_OAUTH_REDIRECT_URI, OAUTH_FRONTEND_REDIRECT_URI
#   = exact production HTTPS URLs
#
# Requires Docker Compose v2.24+ (the `!reset` tag strips the dev ports).
# ============================================================================

name: gitinsight-prod

services:
  postgres:
    ports: !reset []

  eureka-server:
    ports: !reset []

  redis:
    ports: !reset []

  github-service:
    ports: !reset []
    restart: unless-stopped

  analytics-service:
    ports: !reset []
    restart: unless-stopped

  auth-service:
    ports: !reset []
    restart: unless-stopped

  api-gateway:
    ports: !reset []
    restart: unless-stopped

  frontend:
    ports:
      - "80:80"
    restart: unless-stopped
