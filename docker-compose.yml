# ============================================================================
# GitInsight-AI — full stack.
#
#   cp .env.example docker/.env   (or export JWT_SECRET etc. in your shell)
#   docker compose up --build
#
#   Frontend:   http://localhost:5173
#   Eureka:     http://localhost:8761
#   GitHub API: http://localhost:8081/api/github/...
#   Auth API:   http://localhost:8083/api/auth/...
#
# Required env: JWT_SECRET (32+ random bytes — the app refuses to boot without it)
# Optional env: GITHUB_TOKEN (5,000 GitHub req/hr), GEMINI_API_KEY,
#               GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET / GITHUB_OAUTH_REDIRECT_URI
#               / OAUTH_FRONTEND_REDIRECT_URI, POSTGRES_PASSWORD
# ============================================================================

name: gitinsight

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: gitinsight
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-create-dbs.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  eureka-server:
    build:
      context: .
      target: eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8761/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  github-service:
    build:
      context: .
      target: github-service
    environment:
      SPRING_DATASOURCE_URL: ${GITHUB_DATABASE_URL:-jdbc:postgresql://postgres:5432/gitinsight_github}
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — set it before starting}
      JWT_MIN_SECRET_BYTES: ${JWT_MIN_SECRET_BYTES:-64}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Shared Redis: GitHub/AI cache + AI rate limiting (degrades to in-memory if down).
      REDIS_HOST: redis
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  analytics-service:
    build:
      context: .
      target: analytics-service
    environment:
      SPRING_DATASOURCE_URL: ${ANALYTICS_DATABASE_URL:-jdbc:postgresql://postgres:5432/gitinsight_analytics}
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  auth-service:
    build:
      context: .
      target: auth-service
    environment:
      SPRING_DATASOURCE_URL: ${AUTH_DATABASE_URL:-jdbc:postgresql://postgres:5432/gitinsight_auth}
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — set it before starting}
      JWT_MIN_SECRET_BYTES: ${JWT_MIN_SECRET_BYTES:-64}
      REDIS_HOST: redis
      GITHUB_SERVICE_URL: http://github-service:8081
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_OAUTH_REDIRECT_URI: ${GITHUB_OAUTH_REDIRECT_URI:-http://localhost:8083/api/auth/oauth/github/callback}
      OAUTH_FRONTEND_REDIRECT_URI: ${OAUTH_FRONTEND_REDIRECT_URI:-http://localhost:5173/auth/callback}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - github-service
      - auth-service

volumes:
  pgdata:
