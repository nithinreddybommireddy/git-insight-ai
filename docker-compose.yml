# ============================================================================
# GitInsight-AI — full stack.
#
#   cp .env.example docker/.env   (or export JWT_SECRET etc. in your shell)
#   docker compose up --build
#
#   Frontend:   http://localhost:5173
#   Gateway:    http://localhost:8080  (all /api/** routes)
#   Eureka:     http://localhost:8761
#   GitHub API: http://localhost:8081  (internal)
#   Auth API:   http://localhost:8083  (internal)
#
#   Production: all traffic goes through the Gateway (port 8080).
#   Internal service ports are for local debugging only.
#
# Required env: JWT_SECRET (32+ random bytes — the app refuses to boot without it)
# Optional env: GITHUB_TOKEN (5,000 GitHub req/hr), GEMINI_API_KEY,
#               GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET / GITHUB_OAUTH_REDIRECT_URI
#               / OAUTH_FRONTEND_REDIRECT_URI, POSTGRES_PASSWORD
# ============================================================================

name: gitinsight

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: gitinsight
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-create-dbs.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  eureka-server:
    build:
      context: .
      target: eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8761/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    # Honor REDIS_PASSWORD when set (empty value = no auth, matching local dev);
    # the services read the same env var. Without this the Spring apps would
    # try to authenticate while the server requires no password (or vice versa).
    command: ["sh", "-c", "exec redis-server --requirepass \"$${REDIS_PASSWORD}\""]
    ports:
      - "6379:6379"
    healthcheck:
      # Works with or without a password: plain PING succeeds when unauthenticated,
      # and -a authenticates when a password is set.
      test: ["CMD-SHELL", "redis-cli ping >/dev/null 2>&1 || redis-cli -a \"$$REDIS_PASSWORD\" ping >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 12

  github-service:
    build:
      context: .
      target: github-service
    environment:
      SPRING_DATASOURCE_URL: ${GITHUB_DATABASE_URL:-jdbc:postgresql://postgres:5432/gitinsight_github}
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — set it before starting}
      JWT_MIN_SECRET_BYTES: ${JWT_MIN_SECRET_BYTES:-64}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Shared secret that lets auth-service call this service's internal AI
      # endpoints. Must match on both services (see docker/env.example).
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      # Shared Redis: GitHub/AI cache + AI rate limiting (degrades to in-memory if down).
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  analytics-service:
    build:
      context: .
      target: analytics-service
    environment:
      SPRING_DATASOURCE_URL: ${ANALYTICS_DATABASE_URL:-jdbc:postgresql://postgres:5432/gitinsight_analytics}
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      EUREKA_URL: http://eureka-server:8761/eureka/
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  auth-service:
    build:
      context: .
      target: auth-service
    environment:
      SPRING_DATASOURCE_URL: ${AUTH_DATABASE_URL:-jdbc:postgresql://postgres:5432/gitinsight_auth}
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — set it before starting}
      JWT_MIN_SECRET_BYTES: ${JWT_MIN_SECRET_BYTES:-64}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      GITHUB_SERVICE_URL: http://github-service:8081
      # Shared secret used when calling github-service's internal AI endpoints
      # (/api/ai/job-match). Must match INTERNAL_API_KEY on github-service.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_OAUTH_REDIRECT_URI: ${GITHUB_OAUTH_REDIRECT_URI:-http://localhost:8080/api/auth/oauth/github/callback}
      OAUTH_FRONTEND_REDIRECT_URI: ${OAUTH_FRONTEND_REDIRECT_URI:-http://localhost:5173/auth/callback}
      # Cookie security: set AUTH_COOKIE_SECURE=true in production (Vercel proxy = same-origin, Lax works)
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-Lax}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      target: api-gateway
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — set it before starting}
      JWT_MIN_SECRET_BYTES: ${JWT_MIN_SECRET_BYTES:-64}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
      auth-service:
        condition: service_started
      github-service:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api-gateway

volumes:
  pgdata:
