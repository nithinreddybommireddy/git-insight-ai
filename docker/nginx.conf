server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # All API requests go through the API Gateway.
    # The gateway uses Eureka service discovery to route to the correct service.
    # This eliminates hardcoded port routing and enables centralized JWT/CORS/rate-limiting.
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # Forward cookies (auth + CSRF) through the gateway
        proxy_cookie_path / /;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
