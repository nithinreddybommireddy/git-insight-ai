<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" role="img" aria-label="GitInsight-AI — Analyze. Understand. Grow.">
  <defs>
    <!-- G: dark blue on the left, brighter blue on the right -->
    <linearGradient id="gi-g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a2d66"/>
      <stop offset="1" stop-color="#2e5bd4"/>
    </linearGradient>
  </defs>

  <!-- Pure black background tile -->
  <rect width="640" height="600" rx="48" fill="#000000"/>

  <!-- Icon mark — same artwork as icon.svg, scaled for the lockup -->
  <g transform="translate(213 36) scale(0.42)">
    <rect width="512" height="512" rx="112" fill="#000000"/>

    <!-- "G": bold rounded ring with a right-side opening + crossbar -->
    <g fill="none" stroke="url(#gi-g)" stroke-width="64" stroke-linecap="round">
      <path d="M 200 116 A 140 140 0 1 0 340 256"/>
      <path d="M 340 256 L 292 256"/>
    </g>

    <!-- GitHub octocat inside the G counter (dark navy silhouette) -->
    <g transform="translate(163 213) scale(5.6)">
      <path fill="#16295e" fill-rule="evenodd"
            d="M9.356 1.85C5.05 1.85 1.57 5.356 1.57 9.694a7.84 7.84 0 0 0 5.324 7.44c.387.079.528-.168.528-.376 0-.182-.013-.805-.013-1.454-2.165.467-2.616-.935-2.616-.935-.349-.91-.864-1.143-.864-1.143-.71-.48.051-.48.051-.48.787.051 1.2.805 1.2.805.695 1.194 1.817.857 2.268.649.064-.507.27-.857.49-1.052-1.728-.182-3.545-.857-3.545-3.87 0-.857.31-1.558.8-2.104-.078-.195-.349-1 .077-2.078 0 0 .657-.208 2.14.805a7.5 7.5 0 0 1 1.946-.26c.657 0 1.328.092 1.946.26 1.483-1.013 2.14-.805 2.14-.805.426 1.078.155 1.883.078 2.078.502.546.799 1.247.799 2.104 0 3.013-1.818 3.675-3.558 3.87.284.247.528.714.528 1.454 0 1.052-.012 1.896-.012 2.156 0 .208.142.455.528.377a7.84 7.84 0 0 0 5.324-7.441c.013-4.338-3.48-7.844-7.773-7.844"
            clip-rule="evenodd"/>
    </g>

    <!-- "i" bars right of the G: left lighter cyan-blue & shorter, right vibrant royal blue & taller -->
    <rect x="376" y="240" width="38" height="96" rx="19" fill="#41b0f2"/>
    <rect x="428" y="192" width="38" height="152" rx="19" fill="#2f4be0"/>

    <!-- Dark upward trend line overlaid across the G and bars, ending up-right -->
    <path d="M 128 362 L 218 322 L 312 272 L 402 222"
          fill="none" stroke="#0d1526" stroke-width="14"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Dark arrowhead pointing up-right -->
    <path d="M 402 222 l -16 12 M 402 222 l -4 -20"
          fill="none" stroke="#0d1526" stroke-width="14"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Three dark circular data nodes along the path -->
    <g fill="#0d1526">
      <circle cx="128" cy="362" r="11"/>
      <circle cx="218" cy="322" r="11"/>
      <circle cx="312" cy="272" r="11"/>
    </g>
  </g>

  <!-- Wordmark: GitInsight (dark navy) + -AI (bright cyan-blue) -->
  <text x="320" y="374" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="58" font-weight="800" letter-spacing="0.5">
    <tspan fill="#1c2f6b">GitInsight</tspan><tspan fill="#0a84ff">-AI</tspan>
  </text>

  <!-- Divider: thin blue line broken by a circular octocat badge -->
  <line x1="140" y1="428" x2="500" y2="428" stroke="#2a3b66" stroke-width="3"/>
  <circle cx="320" cy="428" r="24" fill="#05070f" stroke="#0a84ff" stroke-width="3.5"/>
  <g transform="translate(306 412) scale(2.15)">
    <path fill="#7fa8ff" fill-rule="evenodd"
          d="M9.356 1.85C5.05 1.85 1.57 5.356 1.57 9.694a7.84 7.84 0 0 0 5.324 7.44c.387.079.528-.168.528-.376 0-.182-.013-.805-.013-1.454-2.165.467-2.616-.935-2.616-.935-.349-.91-.864-1.143-.864-1.143-.71-.48.051-.48.051-.48.787.051 1.2.805 1.2.805.695 1.194 1.817.857 2.268.649.064-.507.27-.857.49-1.052-1.728-.182-3.545-.857-3.545-3.87 0-.857.31-1.558.8-2.104-.078-.195-.349-1 .077-2.078 0 0 .657-.208 2.14.805a7.5 7.5 0 0 1 1.946-.26c.657 0 1.328.092 1.946.26 1.483-1.013 2.14-.805 2.14-.805.426 1.078.155 1.883.078 2.078.502.546.799 1.247.799 2.104 0 3.013-1.818 3.675-3.558 3.87.284.247.528.714.528 1.454 0 1.052-.012 1.896-.012 2.156 0 .208.142.455.528.377a7.84 7.84 0 0 0 5.324-7.441c.013-4.338-3.48-7.844-7.773-7.844"
          clip-rule="evenodd"/>
  </g>

  <!-- Tagline: ANALYZE • UNDERSTAND • GROW (muted grey-blue with blue dots) -->
  <text x="320" y="510" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="24" font-weight="600" letter-spacing="7">
    <tspan fill="#8fa3c8">ANALYZE</tspan>
    <tspan fill="#0a84ff"> • </tspan>
    <tspan fill="#8fa3c8">UNDERSTAND</tspan>
    <tspan fill="#0a84ff"> • </tspan>
    <tspan fill="#8fa3c8">GROW</tspan>
  </text>
</svg>
