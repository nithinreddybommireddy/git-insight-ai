spring:
  application:
    name: github-service

  datasource:
    url: jdbc:postgresql://localhost:5432/gitinsight_github
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

github:
  token: ${GITHUB_TOKEN:}

gemini:
  api:
    key: ${GEMINI_API_KEY:}
