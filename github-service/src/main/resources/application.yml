spring:
  application:
    name: github-service

  datasource:
    # DATABASE_URL / DATABASE_USERNAME / DATABASE_PASSWORD are the production
    # names; the SPRING_DATASOURCE_* forms (used by docker-compose) still work
    # and take precedence when both are set (relaxed binding).

    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gitinsight_github}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    # SQL logging off by default; enable with SHOW_SQL=true when debugging locally.
    show-sql: ${SHOW_SQL:false}
    # Production: don't keep a lazy-load session open during view/serialization.
    open-in-view: false

  data:
    redis:
      # Shared Redis: GitHub API cache + AI response cache + AI rate limiting.
      # The service degrades gracefully (in-memory cache, limiter fail-open)
      # when Redis is unreachable, so a local run without Redis still works.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

  autoconfigure:
    # JWT-filter auth only — no default in-memory user / generated password.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server:
  port: 8081

eureka:
  client:
    service-url:
      # EUREKA_URL is the production name; EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
      # (docker-compose) still overrides it via relaxed binding when set.
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

app:
  cors:
    # Comma-separated allowlist of frontend origins (only needed when the frontend
    # is hosted on a different origin; same-origin proxies never trigger CORS).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    # Per-client budget for the AI endpoints (/api/ai/**) — each Gemini call
    # consumes quota/money, so this guards against runaway or abusive traffic.
    ai-rate-limit-per-minute: ${AI_RATE_LIMIT_PER_MINUTE:30}
    # Shared secret for internal server-to-server endpoints (/api/ai/job-match).
    # Must match INTERNAL_API_KEY on auth-service. When unset the internal
    # endpoints are disabled (fail closed) and recruiter AI explanations degrade
    # to the deterministic ranking.
    internal-api-key: ${INTERNAL_API_KEY:}
  jwt:
    # Shared signing secret from auth-service. No fallback: a service that
    # protects endpoints with JWTs must not boot with a known/committed key.
    secret: ${JWT_SECRET}
    # Minimum signing-key length in bytes. Raise to 64 in production
    # (JWT_MIN_SECRET_BYTES=64) so deployments cannot ship a 32-byte key.
    min-secret-bytes: ${JWT_MIN_SECRET_BYTES:32}

github:
  token: ${GITHUB_TOKEN:}

gemini:
  api:
    key: ${GEMINI_API_KEY:}
