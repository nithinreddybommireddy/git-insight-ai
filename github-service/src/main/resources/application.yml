spring:
  application:
    name: github-service

  datasource:
    url: jdbc:postgresql://localhost:5432/gitinsight_github
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

app:
  jwt:
    # Shared signing secret from auth-service. No fallback: a service that
    # protects endpoints with JWTs must not boot with a known/committed key.
    secret: ${JWT_SECRET}

github:
  token: ${GITHUB_TOKEN:}

gemini:
  api:
    key: ${GEMINI_API_KEY:}
